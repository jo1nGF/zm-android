name: Build OZMA APK
on:
  push:
  workflow_dispatch:

jobs:
  runtime:
    # Debian bullseye = glibc 2.31 (before clone3), which is the safe choice for Android 12's seccomp filter.
    runs-on: ubuntu-24.04
    container: debian:bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: apt-get update && apt-get install -y gcc-aarch64-linux-gnu zip unzip file
      - name: Build runtime.zip (shim + glibc + OZMA)
        run: |
          ZIP="$(ls ozma/*.zip 2>/dev/null | head -1)"
          [ -n "$ZIP" ] || { echo "::error::Put OZMA-0_9_5-ports.zip inside the ozma/ folder of the repo"; exit 1; }
          bash tools/build_assets.sh "$ZIP"
          file app/src/main/assets/runtime.zip
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-assets
          path: app/src/main/assets
          retention-days: 3

  apk:
    needs: runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-assets
          path: app/src/main/assets
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ozma-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
