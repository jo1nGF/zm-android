name: Build OZMA APK
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Find the OZMA zip you committed
        run: |
          ZIP="$(ls ozma/*.zip 2>/dev/null | head -1)"
          [ -n "$ZIP" ] || { echo "::error::Put OZMA-0_9_5-ports.zip inside the ozma/ folder of the repo"; exit 1; }
          echo "OZMA_ZIP=$ZIP" >> "$GITHUB_ENV"

      # Debian bullseye = glibc 2.31 (before clone3): safest for Android 12's seccomp filter.
      # Only compiles the shim and copies the glibc files; zip/unzip are not needed in here.
      - name: Build aarch64 shim + glibc in Debian bullseye
        run: |
          mkdir -p build/libs
          docker run --rm -v "$PWD":/w debian:bullseye bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            aarch64-linux-gnu-gcc -shared -fPIC -O2 -fvisibility=hidden -Wl,-soname,libSDL2-2.0.so.0 \
              -o /w/build/libs/libSDL2-2.0.so.0 /w/shim/sdl_shim.c -lpthread
            for f in ld-linux-aarch64.so.1 libc.so.6 libm.so.6 libpthread.so.0 libdl.so.2; do
              cp -L /usr/aarch64-linux-gnu/lib/$f /w/build/libs/$f
            done
            chmod -R a+rwX /w/build
          '
          ls -l build/libs

      - name: Build runtime.zip (OZMA + libs)
        run: PREBUILT_LIBS="$PWD/build/libs" bash tools/build_assets.sh "$OZMA_ZIP"

      - name: Install ARM64 ELF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Inspect packaged ARM64 ELF files
        run: |
          set -euo pipefail
          mkdir -p build/elf
          unzip -p app/src/main/assets/runtime.zip bin/bricktracker > build/elf/bricktracker
          for f in libSDL2-2.0.so.0 ld-linux-aarch64.so.1 libc.so.6 libm.so.6 libpthread.so.0 libdl.so.2; do
            cp "build/libs/$f" "build/elf/$f"
          done
          {
            for f in build/elf/*; do
              echo "===== $f ====="
              header="$(aarch64-linux-gnu-readelf -h "$f")"
              echo "$header" | grep -E 'Class:|Data:|Machine:'
              echo "$header" | grep -q 'Class:.*ELF64'
              echo "$header" | grep -q 'Machine:.*AArch64'
              aarch64-linux-gnu-readelf -l "$f" | grep 'Requesting program interpreter' || true
              aarch64-linux-gnu-readelf -d "$f" | grep 'NEEDED' || true
            done
          } | tee build/ozma-elf-report.txt

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ozma-android-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/ozma-elf-report.txt
          retention-days: 14
